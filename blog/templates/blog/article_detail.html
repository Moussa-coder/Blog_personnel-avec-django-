<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.titre }}</title>
    <style>
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #3b82f6;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="background-color: #f3f4f6; font-family: sans-serif;">
    <div class="container">
        <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem;">{{ article.titre }}</h1>
        <p style="white-space: pre-line; line-height: 1.6;">{{ article.contenu }}</p>
        <a href="{% url 'article_list' %}" class="back-link">← Retour à la liste</a>
    </div>
</body>
</html>
