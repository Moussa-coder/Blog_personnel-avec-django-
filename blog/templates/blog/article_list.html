<h1>Liste des articles</h1>
<a href="{% url 'article_create' %}">+ Nouvel article</a>
<ul>
  {% for article in articles %}
    <li>
      <a href="{% url 'article_detail' article.pk %}">{{ article.titre }}</a>
      - <a href="{% url 'article_update' article.pk %}">Modifier</a>
      - <a href="{% url 'article_delete' article.pk %}">Supprimer</a>
    </li>
  {% endfor %}
</ul>
